<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16121a"/>
      <stop offset="0.55" stop-color="#1d1320"/>
      <stop offset="1" stop-color="#241016"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8ec7"/>
      <stop offset="1" stop-color="#ff5fa8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="316" rx="27" fill="none" stroke="#ff69b4" stroke-opacity="0.30" stroke-width="2"/>

  <!-- sponsor tag -->
  <text x="80" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#ff8ec7" font-weight="700">SPONSOR · 赞助商</text>

  <!-- logo tile (NovaDiffusion favicon mark) -->
  <g filter="url(#glow)">
    <rect x="80" y="116" width="120" height="120" rx="26" fill="#5DDC9A"/>
    <g fill="none" stroke="#0d281f" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(80,116) scale(1.875)">
      <circle cx="22" cy="42" r="9"/>
      <path d="M28 36 L52 12"/>
      <path d="M44 20 L50 26"/>
      <path d="M38 26 L43 31"/>
    </g>
  </g>

  <!-- name -->
  <text x="232" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Nova<tspan fill="#5DDC9A">Diffusion</tspan> <tspan fill="url(#pink)">API</tspan></text>

  <!-- tagline -->
  <text x="234" y="214" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="27" fill="#e8d6e0" font-weight="600">全网最靠谱 · 最安全 · 几乎最实惠的满血 Claude / GPT</text>

  <!-- sub -->
  <text x="234" y="252" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="20" fill="#9b8a94">无降智 · 无限速 · 稳定直连官方源</text>

  <!-- CTA pill -->
  <g>
    <rect x="234" y="270" width="300" height="34" rx="17" fill="url(#pink)"/>
    <text x="384" y="293" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#1a0d14">api.novadiffusion.com  →</text>
  </g>
</svg>
