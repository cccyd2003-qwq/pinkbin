[package]
name = "pinkbin-cli"
version.workspace     = true
edition.workspace     = true
license.workspace     = true

[[bin]]
name = "pinkbin-cli"
path = "src/main.rs"

[dependencies]
serde.workspace              = true
serde_json.workspace         = true
anyhow.workspace             = true
tracing.workspace            = true
tracing-subscriber.workspace = true
clap.workspace               = true
include_dir.workspace        = true
toml.workspace               = true
globset.workspace            = true
jwalk.workspace              = true
chrono.workspace             = true

pinkbin-scanner    = { path = "../scanner" }
pinkbin-scaffold   = { path = "../scaffold" }
pinkbin-executor   = { path = "../executor" }
pinkbin-guard      = { path = "../guard" }
pinkbin-dedup      = { path = "../dedup" }
pinkbin-inventory  = { path = "../inventory" }
pinkbin-system-ops = { path = "../system-ops" }

# Windows-only: 用于 --elevate flag 的提权重启(ShellExecuteW 'runas' +
# OpenProcessToken/GetTokenInformation 检测当前是否已提权)。
# 非 Windows 平台该模块编译为 no-op。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }
